name: Sync multi-image feature and deploy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-multi-image.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

